  #     - "8000:80"

  # scheduler:                     # roadmap phase 5 — Python OR-Tools CP-SAT
  #   build: ./scheduler
  #   environment:
  #     SOLVE_SHARED_SECRET: ${SOLVE_SHARED_SECRET}
