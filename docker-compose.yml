# ShiftPlanner production container stack.
#
# Build a release image with scripts/build-image.ps1. Copy its tar file,
# this file, and a configured .env file to the server. Local development
# continues to run on the host against SQLite.

services:
  app:
    image: "shiftplanner:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - app-storage:/var/www/html/storage/app
    restart: unless-stopped

  queue:
    image: "shiftplanner:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shiftplanner}
      POSTGRES_USER: ${DB_USERNAME:-shiftplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftplanner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shiftplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # app:
  #   build: ./docker/app          # PHP-FPM + nginx, built in a later phase
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file: .env
