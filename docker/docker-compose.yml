# ShiftPlanner production container stack.
#
# GitHub Actions builds the image and pushes it to GHCR on each v* tag.
# See doc/docker-setup.md. Local development continues to run on the host
# against SQLite.

services:
  app:
    image: "ghcr.io/johnbekendam/shiftplanner:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - app-storage:/var/www/html/storage/app
    restart: unless-stopped

  queue:
    image: "ghcr.io/johnbekendam/shiftplanner:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shiftplanner}
      POSTGRES_USER: ${DB_USERNAME:-shiftplanner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftplanner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shiftplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # app:
  #   build: ./app                 # PHP-FPM + nginx, built in a later phase
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file: .env
  #   ports:
  #     - "8000:80"

  # Roadmap phase 5 (the scheduling engine) runs entirely inside the `app`
  # and `queue` services above — a plain PHP heuristic planner, not a
  # separate service. No extra compose entry needed for it.

volumes:
  app-storage:
  postgres-data:
