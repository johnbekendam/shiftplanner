; Stock php:8.4-apache ships no php.ini, so PHP falls back to its
; compiled-in defaults (upload_max_filesize=2M, post_max_size=8M). Those
; silently reject any application backup upload over ~2 MB before Laravel
; ever runs its own "max:51200" (50 MB) validation rule — see
; App\Http\Controllers\EmployeeBackupController::import().
upload_max_filesize = 52M
post_max_size = 60M
